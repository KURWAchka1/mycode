plugins {
    id 'com.android.application'
}

android {
    namespace 'app.playerokmonitor'
    compileSdk 36

    defaultConfig {
        applicationId 'app.playerokmonitor'
        minSdk 26
        targetSdk 36
        versionCode 27
        versionName '2.3.17'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            res.srcDir "$buildDir/generated/res/orderSound"
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

// Generate a clean, short two-note chime during the build. The mix is louder
// than the original signal, but a soft limiter and long fades prevent clipping
// and keep the C5/G5 notification calm on small phone speakers.
def generatedSoundDir = file("$buildDir/generated/res/orderSound/raw")
def generatedSoundFile = file("$buildDir/generated/res/orderSound/raw/order_alert.wav")

def generateOrderAlert = tasks.register('generateOrderAlert') {
    outputs.file(generatedSoundFile)
    doLast {
        generatedSoundDir.mkdirs()

        final int sampleRate = 44100
        final int bitsPerSample = 16
        final int bytesPerSample = bitsPerSample / 8
        final double durationSeconds = 0.50d
        final int sampleCount = (int) Math.round(sampleRate * durationSeconds)
        byte[] pcm = new byte[sampleCount * bytesPerSample]

        def smoothstep = { double x ->
            double v = Math.max(0.0d, Math.min(1.0d, x))
            v * v * (3.0d - 2.0d * v)
        }

        for (int i = 0; i < sampleCount; i++) {
            double t = i / (double) sampleRate

            double note1 = 0.0d
            if (t >= 0.012d && t < 0.36d) {
                double x = t - 0.012d
                double attack = smoothstep(x / 0.030d)
                double decay = Math.exp(-6.8d * x)
                double release = t > 0.31d ? smoothstep((0.36d - t) / 0.05d) : 1.0d
                note1 = attack * decay * release * Math.sin(2.0d * Math.PI * 523.251d * x)
            }

            double note2 = 0.0d
            if (t >= 0.135d && t < 0.485d) {
                double x = t - 0.135d
                double attack = smoothstep(x / 0.032d)
                double decay = Math.exp(-6.2d * x)
                double release = t > 0.425d ? smoothstep((0.485d - t) / 0.060d) : 1.0d
                note2 = attack * decay * release * Math.sin(2.0d * Math.PI * 783.991d * x)
            }

            double mixed = 0.38d * note1 + 0.32d * note2
            double wave = 0.78d * Math.tanh(1.35d * mixed) / Math.tanh(1.35d)
            if (t > 0.465d) {
                wave *= smoothstep((durationSeconds - t) / 0.035d)
            }

            int sample = (int) Math.round(Math.max(-1.0d, Math.min(1.0d, wave)) * 32767.0d)
            int offset = i * 2
            pcm[offset] = (byte) (sample & 0xff)
            pcm[offset + 1] = (byte) ((sample >>> 8) & 0xff)
        }

        generatedSoundFile.withOutputStream { stream ->
            def writeAscii = { String s -> stream.write(s.getBytes('US-ASCII')) }
            def writeLe16 = { int v ->
                stream.write(v & 0xff)
                stream.write((v >>> 8) & 0xff)
            }
            def writeLe32 = { int v ->
                stream.write(v & 0xff)
                stream.write((v >>> 8) & 0xff)
                stream.write((v >>> 16) & 0xff)
                stream.write((v >>> 24) & 0xff)
            }

            writeAscii('RIFF')
            writeLe32(36 + pcm.length)
            writeAscii('WAVE')
            writeAscii('fmt ')
            writeLe32(16)
            writeLe16(1)
            writeLe16(1)
            writeLe32(sampleRate)
            writeLe32(sampleRate * bytesPerSample)
            writeLe16(bytesPerSample)
            writeLe16(bitsPerSample)
            writeAscii('data')
            writeLe32(pcm.length)
            stream.write(pcm)
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'preBuild' || (task.name.startsWith('merge') && task.name.endsWith('Resources'))) {
        task.dependsOn(generateOrderAlert)
    }
}
