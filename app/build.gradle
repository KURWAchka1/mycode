plugins {
    id 'com.android.application'
}

android {
    namespace 'app.playerokmonitor'
    compileSdk 36

    defaultConfig {
        applicationId 'app.playerokmonitor'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            res.srcDir "$buildDir/generated/res/orderSound"
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

// Generate a short, soft and distinctive two-note chime during the build.
// The alert intentionally uses a conservative amplitude and smooth envelopes,
// so it is recognizable without sounding like an alarm.
def generatedSoundDir = file("$buildDir/generated/res/orderSound/raw")
def generatedSoundFile = file("$buildDir/generated/res/orderSound/raw/order_alert.wav")

def generateOrderAlert = tasks.register('generateOrderAlert') {
    outputs.file(generatedSoundFile)
    doLast {
        generatedSoundDir.mkdirs()

        final int sampleRate = 16000
        final double durationSeconds = 0.48d
        final int sampleCount = (int) (sampleRate * durationSeconds)
        byte[] pcm = new byte[sampleCount]

        for (int i = 0; i < sampleCount; i++) {
            double t = i / (double) sampleRate

            // First soft bell: C5 -> a calm recognizable opening.
            double a1 = 0.0d
            if (t >= 0.015d && t < 0.34d) {
                double x = t - 0.015d
                double attack = Math.min(1.0d, x / 0.025d)
                double decay = Math.exp(-7.2d * x)
                a1 = attack * decay
            }

            // Second bell: G5 starts slightly later and overlaps for a pleasant
            // consonant interval instead of a harsh siren-like sweep.
            double a2 = 0.0d
            if (t >= 0.13d && t < 0.47d) {
                double x = t - 0.13d
                double attack = Math.min(1.0d, x / 0.028d)
                double decay = Math.exp(-6.6d * x)
                a2 = attack * decay
            }

            // Tiny high shimmer makes it unique, but remains much quieter than
            // the two main notes.
            double shimmer = 0.0d
            if (t >= 0.19d && t < 0.43d) {
                double x = t - 0.19d
                shimmer = Math.min(1.0d, x / 0.020d) * Math.exp(-10.0d * x)
            }

            double wave =
                    0.18d * a1 * Math.sin(2.0d * Math.PI * 523.25d * t) +
                    0.15d * a2 * Math.sin(2.0d * Math.PI * 783.99d * t) +
                    0.035d * shimmer * Math.sin(2.0d * Math.PI * 1174.66d * t)

            // Gentle fade-out prevents a click at the end of the WAV.
            if (t > 0.42d) {
                wave *= Math.max(0.0d, (durationSeconds - t) / (durationSeconds - 0.42d))
            }

            int unsignedSample = Math.max(0, Math.min(255,
                    (int) Math.round(128.0d + 127.0d * wave)))
            pcm[i] = (byte) unsignedSample
        }

        generatedSoundFile.withOutputStream { stream ->
            def writeAscii = { String s -> stream.write(s.getBytes('US-ASCII')) }
            def writeLe16 = { int v ->
                stream.write(v & 0xff)
                stream.write((v >>> 8) & 0xff)
            }
            def writeLe32 = { int v ->
                stream.write(v & 0xff)
                stream.write((v >>> 8) & 0xff)
                stream.write((v >>> 16) & 0xff)
                stream.write((v >>> 24) & 0xff)
            }

            writeAscii('RIFF')
            writeLe32(36 + pcm.length)
            writeAscii('WAVE')
            writeAscii('fmt ')
            writeLe32(16)
            writeLe16(1)          // PCM
            writeLe16(1)          // mono
            writeLe32(sampleRate)
            writeLe32(sampleRate) // byte rate: 8-bit mono
            writeLe16(1)          // block align
            writeLe16(8)          // bits per sample
            writeAscii('data')
            writeLe32(pcm.length)
            stream.write(pcm)
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'preBuild' || (task.name.startsWith('merge') && task.name.endsWith('Resources'))) {
        task.dependsOn(generateOrderAlert)
    }
}
