name: VPS server CI

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SERVER_VERSION: 1.0.0
  SERVER_TAG: server-v1.0.0

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Run server contract tests
        env:
          PYTHONPATH: server
        run: python server/tests/test_order_state.py

      - name: Validate installer
        run: |
          bash -n server/install-playerok-monitor.sh
          shellcheck --severity=error server/install-playerok-monitor.sh

      - name: Prepare installer asset
        run: |
          install -m 0755 server/install-playerok-monitor.sh install-playerok-monitor.sh
          sha256sum install-playerok-monitor.sh > install-playerok-monitor.sh.sha256

      - name: Publish VPS installer release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$SERVER_TAG" >/dev/null 2>&1; then
            gh release upload "$SERVER_TAG" install-playerok-monitor.sh install-playerok-monitor.sh.sha256 --clobber
          else
            gh release create "$SERVER_TAG" install-playerok-monitor.sh install-playerok-monitor.sh.sha256 \
              --target "$GITHUB_SHA" \
              --title "Playerok Monitor VPS $SERVER_VERSION" \
              --notes "Интерактивная установка и безопасное повторное обновление VPS с сохранением базы, токенов, HTTPS и Pairing URL."
          fi
