name: Windows Desktop CI

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  DESKTOP_VERSION: 1.1.8
  DESKTOP_TAG: desktop-v1.1.8

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Generate application icon
        shell: pwsh
        run: ./desktop/scripts/GenerateIcon.ps1

      - name: Restore
        shell: pwsh
        run: dotnet restore ./desktop/PlayerokMonitor.Desktop.sln

      - name: Run contract and statistics tests
        shell: pwsh
        run: dotnet run --project ./desktop/tests/PlayerokMonitor.Core.Tests/PlayerokMonitor.Core.Tests.csproj -c Release --no-restore

      - name: Publish self-contained Windows 11 app
        shell: pwsh
        run: >-
          dotnet publish ./desktop/src/PlayerokMonitor.Desktop/PlayerokMonitor.Desktop.csproj
          -c Release -r win-x64 --self-contained true --no-restore
          -o ./desktop/publish

      - name: Run application smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./desktop/publish/PlayerokMonitor.Desktop.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Application smoke test failed: $($process.ExitCode)" }

      - name: Verify offline catch-up and monitor shutdown
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./desktop/publish/PlayerokMonitor.Desktop.exe -ArgumentList '--monitor-lifecycle-smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Monitor lifecycle smoke test failed: $($process.ExitCode)" }

      - name: Verify search field layouts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./desktop/ui-smoke | Out-Null
          foreach ($section in @('search', 'command', 'review', 'defaults', 'defaults-focused', 'defaults-blurred')) {
            $output = (Resolve-Path ./desktop/ui-smoke).Path + "\$section.png"
            $arguments = @('--render-preview', "`"$output`"", '--preview-section', $section, '--preview-width', '1280', '--preview-height', '820')
            $process = Start-Process -FilePath ./desktop/publish/PlayerokMonitor.Desktop.exe -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0 -or !(Test-Path $output)) { throw "Search layout smoke test failed: $section" }
          }

      - name: Install Velopack packager
        shell: pwsh
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Restore previous full package for delta updates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force ./desktop/Releases | Out-Null
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=20" | ConvertFrom-Json
          $previous = $releases |
            Where-Object { $_.tag_name -like 'desktop-v*' -and $_.tag_name -ne $env:DESKTOP_TAG } |
            Sort-Object { [version]($_.tag_name -replace '^desktop-v', '') } -Descending |
            Select-Object -First 1
          if ($previous) {
            Write-Host "Using $($previous.tag_name) as delta base"
            gh release download $previous.tag_name --pattern 'PlayerokMonitorDesktop-*-full.nupkg' --dir ./desktop/Releases
          } else {
            Write-Host 'First desktop release: full package only'
          }

      - name: Build updating Setup.exe
        shell: pwsh
        run: >-
          vpk pack
          --packId PlayerokMonitorDesktop
          --packVersion $env:DESKTOP_VERSION
          --packDir ./desktop/publish
          --mainExe PlayerokMonitor.Desktop.exe
          --packTitle 'Playerok Monitor'
          --packAuthors 'KURWAchka1'
          --icon ./desktop/assets/app.ico
          --runtime win-x64
          --outputDir ./desktop/Releases
          --releaseNotes ./desktop/RELEASE_NOTES.md

      - name: Keep only current packages in this release
        shell: pwsh
        run: |
          Get-ChildItem ./desktop/Releases/*-full.nupkg |
            Where-Object { $_.Name -notlike "*-$env:DESKTOP_VERSION-full.nupkg" } |
            Remove-Item -Force

      - name: Verify installer and update feed
        shell: pwsh
        run: |
          $setup = Get-ChildItem ./desktop/Releases/*Setup.exe | Select-Object -First 1
          $full = Get-ChildItem ./desktop/Releases/*-full.nupkg | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$setup -or !$full) { throw 'Velopack did not produce installer/update package' }
          if (!(Test-Path ./desktop/Releases/releases.win.json)) { throw 'Missing releases.win.json' }
          Get-ChildItem ./desktop/Releases -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content ./desktop/Releases/SHA256SUMS.txt
          }
          Get-Content ./desktop/Releases/SHA256SUMS.txt

      - name: Silent installer upgrade smoke test
        shell: pwsh
        run: |
          $setup = (Get-ChildItem ./desktop/Releases/*Setup.exe | Select-Object -First 1).FullName
          $process = Start-Process -FilePath $setup -ArgumentList '--silent' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'PlayerokMonitorDesktop\current\PlayerokMonitor.Desktop.exe'
          if (!(Test-Path $installed)) { throw "Installed app was not found: $installed" }
          $app = Start-Process -FilePath $installed -ArgumentList '--smoke-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "Installed application smoke test failed: $($app.ExitCode)" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayerokMonitor-Desktop-${{ env.DESKTOP_VERSION }}-Windows11
          path: |
            desktop/Releases/*Setup.exe
            desktop/Releases/*-full.nupkg
            desktop/Releases/*-delta.nupkg
            desktop/Releases/releases.win.json
            desktop/Releases/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish desktop GitHub release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view $env:DESKTOP_TAG *> $null) {
            gh release upload $env:DESKTOP_TAG ./desktop/Releases/* --clobber
          } else {
            gh release create $env:DESKTOP_TAG ./desktop/Releases/* --target $env:GITHUB_SHA --title "Playerok Monitor Desktop $env:DESKTOP_VERSION · Windows 11" --notes-file ./desktop/RELEASE_NOTES.md
          }
