name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK and run lint
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 install and launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n app.playerokmonitor/.MainActivity
            sleep 4
            PID="$(adb shell pidof app.playerokmonitor | tr -d '\r')"
            test -n "$PID"
            adb shell dumpsys activity activities | grep -F 'app.playerokmonitor/.MainActivity'
            if adb logcat -d -b crash | grep -F 'app.playerokmonitor'; then
              echo 'Application crash detected'
              exit 1
            fi

      - name: Verify APK metadata and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -F "package: name='app.playerokmonitor'" apk-badging.txt
          grep -F "targetSdkVersion:'36'" apk-badging.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayerokMonitor-Android16-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
            apk-signature.txt
          if-no-files-found: error
          retention-days: 30
