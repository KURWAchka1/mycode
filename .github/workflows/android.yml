name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 180 \
            -o /tmp/gradle-8.13-bin.zip \
            https://github.com/gradle/gradle-distributions/releases/download/v8.13.0/gradle-8.13-bin.zip
          echo '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  /tmp/gradle-8.13-bin.zip' | sha256sum -c -
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp
          echo '/tmp/gradle-8.13/bin' >> "$GITHUB_PATH"
          /tmp/gradle-8.13/bin/gradle --version

      - name: Build APK and run lint
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gradle --no-daemon :app:lintDebug :app:assembleDebug; then
            test ! -f app/build/reports/lint-results-debug.txt || cat app/build/reports/lint-results-debug.txt
            exit 1
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 install and launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/android16-smoke-test.sh

      - name: Verify APK metadata and signature
        run: |
          set -eu
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK" | tee apk-badging.txt
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -F "package: name='app.playerokmonitor'" apk-badging.txt
          grep -F "targetSdkVersion:'36'" apk-badging.txt
          grep -F "versionName='2.3.9'" apk-badging.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayerokMonitor-2.3.9-OneUI85
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
            apk-signature.txt
            android16-main-default.png
            android16-main-default.xml
            android16-main-large-text.png
            android16-main-large-text.xml
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable GitHub Release APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v2.3.9-oneui85
        run: |
          set -Eeuo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk PlayerokMonitor-OneUI85-v2.3.9.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PlayerokMonitor-OneUI85-v2.3.9.apk --clobber
          else
            gh release create "$TAG" PlayerokMonitor-OneUI85-v2.3.9.apk \
              --target "$GITHUB_SHA" \
              --title "Playerok Monitor 2.3.9 · One UI Workspace" \
              --notes-file RELEASE_NOTES.md
          fi
